name: PlatformIO CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        environment:
          - d1_mini        # ESP8266
          - build-esp32    # ESP32
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ matrix.environment }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ matrix.environment }}-
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build
        run: platformio run --environment ${{ matrix.environment }}

  # Build all examples to ensure they compile
  build-examples:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        example:
          - examples/simple
          - examples/RemoteDebug_Advanced
          - examples/RemoteDebug_Debugger
        environment:
          - d1_mini
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-examples-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-examples-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build example
        run: |
          platformio run --environment ${{ matrix.environment }} \
            --project-option="src_dir=${{ matrix.example }}"
