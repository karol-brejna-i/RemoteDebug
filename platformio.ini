[platformio]
src_dir = test/build
default_envs = d1_mini

[env]
lib_extra_dirs = .
lib_deps =
  links2004/WebSockets @ 2.7.1
upload_speed = 1500000
monitor_speed = 115200
; build_flags = -D WEBSOCKET_DISABLED=false

[env:build-esp32]
platform = espressif32
board = esp32dev
framework = arduino

[env:m5stick-c]
platform = espressif32
board = m5stick-c
framework = arduino
board_build.variant = m5stack_stickc

[env:d1_mini]
platform = espressif8266
framework = arduino
board = d1_mini
upload_speed = 921600

[env:lolin_d32_pro]
platform = espressif32
framework = arduino
board = lolin_d32_pro

[env:seeed_xiao_esp32c6]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-esp32-c6
framework = arduino
; TODO: Seeed XIAO ESP32-C6 platform's Arduino framework doesn't include 
; the WiFiClientSecure library that WebSockets depends on
build_flags = -D WEBSOCKET_DISABLED=true
lib_ignore = WebSockets

; Integration test environment - uses test firmware with extended test commands
; Usage: pio run -e integration_test -t upload
; Note: This builds from test/integration/ directory
;
; WiFi credentials are passed via environment variables:
;   WIFI_SSID and WIFI_PASSWORD
; Example:
;   WIFI_SSID="MyNetwork" WIFI_PASSWORD="MyPass" pio run -e integration_test -t upload
;
[env:integration_test]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-esp32-c6
framework = arduino
extra_scripts = pre:test/integration/set_src_dir.py
build_flags = -D WEBSOCKET_DISABLED=true
lib_ignore = WebSockets

; Integration test environment with WebSocket support
; Uses esp32-c6-devkitc-1 (official espressif32 platform includes WiFiClientSecure)
; Usage: pio run -e integration_test_ws -t upload -t monitor
[env:integration_test_ws]
platform = espressif32
board = m5stick-c
framework = arduino
board_build.variant = m5stack_stickc
extra_scripts = pre:test/integration/set_src_dir.py
build_flags = -D WEBSOCKET_DISABLED=false
lib_deps = 
    ${env.lib_deps}
    links2004/WebSockets @ 2.7.1